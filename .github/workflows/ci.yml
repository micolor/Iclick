name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Smoke tests
        run: ./scripts/smoke-test.sh

      - name: Build
        run: |
          xcodebuild \
            -project IClick.xcodeproj \
            -scheme IClick \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
